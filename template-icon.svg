    <line x1="575" y1="400" x2="400" y2="585"/>
    <line x1="400" y1="585" x2="225" y2="400"/>
    <line x1="225" y1="400" x2="575" y2="400"/>
    <line x1="400" y1="215" x2="400" y2="585"/>
    <line x1="225" y1="400" x2="400" y2="585"/>
    <line x1="400" y1="215" x2="575" y2="400"/>
  </g>
  <circle cx="225" cy="400" r="52" fill="#FFFFFF"/>
  <circle cx="400" cy="215" r="52" fill="#FFFFFF"/>
  <circle cx="575" cy="400" r="52" fill="#FFFFFF"/>
  <circle cx="400" cy="585" r="52" fill="#FFFFFF"/>
  <circle cx="400" cy="400" r="34" fill="#5B8CFF"/>
